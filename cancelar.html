<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Cancelar reserva · El Casino Vila-real</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#1a1008" />

  <link rel="icon" href="assets/logo/logo-instagram.jpg" type="image/jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --espresso: #1a1008; --cream: #faf4e9; --cream-2: #f3e9d8;
      --ink: #241608; --ink-soft: #6b5844; --border: #e3d5c0;
      --accent-ink: #a8480c;
      --ok: #1f7a44; --mal: #96271e;
      --serif: "Playfair Display", Georgia, serif;
      --sans: "Karla", system-ui, -apple-system, "Segoe UI", sans-serif;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      padding: 1.5rem; background: var(--cream); color: var(--ink);
      font-family: var(--sans); font-size: 16px; line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; cursor: pointer; border: 0; }
    :focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; border-radius: 4px; }

    .caja {
      width: min(28rem, 100%); background: #fff; border-radius: 14px;
      box-shadow: 0 18px 50px rgba(26, 16, 8, .16); overflow: hidden;
    }
    .cab {
      background: var(--espresso); padding: 2rem 1.8rem 1.7rem;
      text-align: center; position: relative; overflow: hidden;
    }
    .cab__naranja {
      position: absolute; top: 50%; left: 50%; width: 200px; opacity: .16;
      transform: translate(-50%, -50%); pointer-events: none;
    }
    .cab img.logo { position: relative; height: 40px; margin-bottom: .6rem; }
    .cab p { position: relative; margin: 0; font-size: .85rem; color: rgba(250, 244, 233, .68); }

    .cuerpo { padding: 1.8rem; }
    h1 { font-family: var(--serif); font-size: 1.45rem; margin: 0 0 .5rem; }
    p { margin: 0 0 1rem; color: var(--ink-soft); }
    p:last-child { margin-bottom: 0; }

    .datos {
      background: var(--cream-2); border-radius: 10px;
      padding: .9rem 1.1rem; margin: 1.2rem 0; display: grid; gap: .35rem;
    }
    .datos div { display: flex; justify-content: space-between; gap: 1rem; font-size: .93rem; }
    .datos .k { color: var(--ink-soft); }
    .datos .v { font-weight: 700; text-align: right; }

    .btn {
      display: block; width: 100%; border-radius: 999px;
      padding: .95em 1.4em; font-weight: 700; font-size: .82rem;
      letter-spacing: .07em; text-transform: uppercase; text-align: center;
      text-decoration: none; transition: background .25s var(--ease), transform .25s var(--ease);
    }
    .btn--mal { background: var(--mal); color: #fff; }
    .btn--mal:hover:not(:disabled) { background: #7d1f18; transform: translateY(-1px); }
    .btn--gris { background: var(--cream-2); color: var(--ink); margin-top: .6rem; }
    .btn--gris:hover { background: var(--border); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }

    .icono {
      width: 62px; height: 62px; margin: 0 auto 1rem; border-radius: 999px;
      display: grid; place-items: center; font-size: 1.9rem; font-weight: 700;
    }
    .icono--ok  { background: rgba(34, 139, 76, .13); color: var(--ok); }
    .icono--mal { background: rgba(176, 52, 42, .11); color: var(--mal); }
    .centro { text-align: center; }

    .spin {
      width: 32px; height: 32px; margin: 1.5rem auto;
      border: 3px solid var(--border); border-top-color: var(--accent-ink);
      border-radius: 50%; animation: gira .8s linear infinite;
    }
    @keyframes gira { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.5s; } }

    .pie { padding: 1.2rem 1.8rem 1.6rem; background: var(--cream-2);
           text-align: center; font-size: .84rem; color: var(--ink-soft); }
    .pie a { color: var(--accent-ink); }
  </style>
</head>

<body>
  <main class="caja">
    <div class="cab">
      <img class="cab__naranja" src="assets/logo/naranja-marca.png" alt="" aria-hidden="true" />
      <img class="logo" src="assets/logo/logo-casino.png" alt="El Casino Vila-real" />
      <p>Cancelar reserva</p>
    </div>

    <div class="cuerpo" id="cuerpo" aria-live="polite">
      <div class="spin" role="status" aria-label="Cargando"></div>
    </div>

    <div class="pie">
      ¿Alguna duda? Llámanos al <a href="tel:+34689229479">689 22 94 79</a>
    </div>
  </main>

  <script>
  (function () {
    'use strict';

    var CFG = {
      url:     'https://zdxcwrwqlrvmsokzoocp.supabase.co',
      anonKey: 'sb_publishable_rpMkEygmQYuVE8QcgON7_g_Yv_JE3kJ'
    };

    var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio',
                 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
    var DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];

    var $cuerpo = document.getElementById('cuerpo');
    var params  = new URLSearchParams(location.search);
    var id = params.get('id') || '';
    var t  = params.get('t')  || '';

    function esc(x) {
      return String(x == null ? '' : x)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function textoFecha(iso) {
      var p = iso.split('-');
      var f = new Date(+p[0], +p[1] - 1, +p[2]);
      return DIAS[f.getDay()] + ', ' + f.getDate() + ' de ' + MESES[f.getMonth()] + ' de ' + f.getFullYear();
    }

    function rpc(nombre, cuerpo) {
      return fetch(CFG.url + '/rest/v1/rpc/' + nombre, {
        method: 'POST',
        headers: {
          'apikey': CFG.anonKey,
          'Authorization': 'Bearer ' + CFG.anonKey,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(cuerpo)
      }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      });
    }

    function tablaDatos(d) {
      return '<div class="datos">' +
        '<div><span class="k">Día</span><span class="v">' + esc(textoFecha(d.fecha)) + '</span></div>' +
        '<div><span class="k">Hora</span><span class="v">' + esc(d.hora) + '</span></div>' +
        '<div><span class="k">Personas</span><span class="v">' + esc(d.personas) + '</span></div>' +
        '<div><span class="k">A nombre de</span><span class="v">' + esc(d.nombre) + '</span></div>' +
        '</div>';
    }

    function fallo(titulo, texto) {
      $cuerpo.innerHTML =
        '<div class="centro"><div class="icono icono--mal" aria-hidden="true">!</div>' +
        '<h1>' + esc(titulo) + '</h1><p>' + esc(texto) + '</p>' +
        '<a class="btn btn--gris" href="index.html">Ir a la web</a></div>';
    }

    function yaCancelada(d) {
      $cuerpo.innerHTML =
        '<div class="centro"><div class="icono icono--ok" aria-hidden="true">✓</div>' +
        '<h1>Reserva cancelada</h1>' +
        '<p>Esta reserva ya estaba anulada. No tienes que hacer nada más.</p></div>' +
        tablaDatos(d) +
        '<a class="btn btn--gris" href="index.html">Volver a la web</a>';
    }

    function hecho(d) {
      $cuerpo.innerHTML =
        '<div class="centro"><div class="icono icono--ok" aria-hidden="true">✓</div>' +
        '<h1>Reserva cancelada</h1>' +
        '<p>Gracias por avisar: la mesa vuelve a quedar libre. ' +
        'Te llegará la confirmación por correo.</p></div>' +
        tablaDatos(d) +
        '<a class="btn btn--gris" href="index.html">Volver a la web</a>';
    }

    function preguntar(d) {
      $cuerpo.innerHTML =
        '<h1>¿Cancelas esta reserva?</h1>' +
        '<p>La mesa quedará libre para otros clientes. Si has abierto el enlace por error, ' +
        'cierra esta página sin pulsar nada.</p>' +
        tablaDatos(d) +
        '<div id="err"></div>' +
        '<button type="button" class="btn btn--mal" id="btnSi">Sí, cancelar la reserva</button>' +
        '<a class="btn btn--gris" href="index.html">No, mantenerla</a>';

      document.getElementById('btnSi').addEventListener('click', function () {
        var b = this;
        b.disabled = true; b.textContent = 'Cancelando…';
        rpc('cancelar_reserva', { p_id: id, p_token: t })
          .then(function (res) {
            if (res && res.ok) {
              if (res.ya_estaba) { yaCancelada(res); } else { hecho(res); }
              return;
            }
            if (res && res.error === 'ya_pasada') {
              fallo('Esa fecha ya ha pasado',
                    'No hace falta cancelarla. Si necesitas algo, llámanos.');
              return;
            }
            fallo('No hemos podido cancelarla',
                  'Inténtalo de nuevo o llámanos por teléfono y lo hacemos nosotros.');
          })
          .catch(function () {
            b.disabled = false; b.textContent = 'Sí, cancelar la reserva';
            document.getElementById('err').innerHTML =
              '<p style="color:#96271e">No hemos podido conectar. Revisa tu conexión.</p>';
          });
      });
    }

    /* ---------- arranque ----------
       Al abrir solo se consulta. Cancelar exige pulsar el botón: los antivirus
       y algunos gestores de correo visitan los enlaces por su cuenta, y eso
       anularía reservas que nadie quiso anular. */
    if (!id || !t) {
      fallo('Enlace incompleto',
            'Abre el enlace tal cual viene en el correo de confirmación, sin recortarlo.');
      return;
    }

    rpc('ver_reserva', { p_id: id, p_token: t })
      .then(function (d) {
        if (!d || !d.ok) {
          fallo('No encontramos esa reserva',
                'Puede que el enlace esté incompleto o que la reserva ya no exista. Llámanos y lo miramos.');
          return;
        }
        if (d.estado === 'cancelada') { yaCancelada(d); return; }
        if (d.pasada) {
          fallo('Esa fecha ya ha pasado', 'No hace falta cancelar nada.');
          return;
        }
        preguntar(d);
      })
      .catch(function () {
        fallo('No hemos podido conectar',
              'Revisa tu conexión e inténtalo otra vez, o llámanos por teléfono.');
      });
  })();
  </script>
</body>
</html>
