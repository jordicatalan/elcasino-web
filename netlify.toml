# Configuración de despliegue en Netlify
# Cada vez que se guarda la carta desde /admin, Netlify vuelve a generar carta.html

[build]
  command = "node build.js"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# El panel no debe salir en Google
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Archivos de trabajo: tampoco deben indexarse
[[headers]]
  for = "/content/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# El panel de reservas tampoco debe indexarse
[[headers]]
  for = "/reservas-admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# La pagina de cancelacion lleva un testigo en la URL: fuera de los buscadores
[[headers]]
  for = "/cancelar.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

# La pagina de nueva contrasena lleva un testigo en la URL
[[headers]]
  for = "/restablecer.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
