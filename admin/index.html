<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Panel de la carta · El Casino</title>
  <link rel="icon" href="/assets/logo/logo-instagram.jpg" type="image/jpeg" />

  <!-- Tipografías de la marca -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Identidad visual del panel -->
  <link rel="stylesheet" href="/admin/estilos-panel.css" />

  <style>
    /* Pantalla de bienvenida mientras carga el panel */
    :root { --naranja: #a8480c; --cafe: #1a1008; --cafe2: #241710; --crema: #faf4e9; }
    html, body { margin: 0; height: 100%; }
    body { font-family: "Karla", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

    #cargando {
      position: fixed; inset: 0; z-index: 9999;
      background:
        radial-gradient(circle at 50% 38%, rgba(232,114,43,.18) 0%, transparent 48%),
        linear-gradient(180deg, var(--cafe) 0%, var(--cafe2) 100%);
      color: var(--crema);
      display: grid; place-items: center; text-align: center; padding: 2rem;
      transition: opacity .5s ease, visibility .5s ease;
    }
    #cargando.oculto { opacity: 0; visibility: hidden; }

    #cargando img {
      width: 108px; height: 108px; border-radius: 50%; object-fit: cover;
      margin-bottom: 1.5rem; box-shadow: 0 14px 34px rgba(0,0,0,.45);
      animation: entrar .8s cubic-bezier(.16,1,.3,1) both;
    }
    #cargando h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.9rem; font-weight: 600; margin: 0 0 .45rem; letter-spacing: -.01em;
      animation: entrar .8s cubic-bezier(.16,1,.3,1) .08s both;
    }
    #cargando p {
      margin: 0; opacity: .62; font-size: .9rem; letter-spacing: .16em; text-transform: uppercase;
      animation: entrar .8s cubic-bezier(.16,1,.3,1) .16s both;
    }
    #puntos { display: inline-block; width: 1.2em; text-align: left; }
    @keyframes entrar { from { opacity: 0; transform: translateY(12px); } }

    @media (prefers-reduced-motion: reduce) {
      #cargando img, #cargando h1, #cargando p { animation: none; }
    }
  </style>
</head>
<body>
  <div id="cargando">
    <div>
      <img src="/assets/logo/logo-instagram.jpg" alt="" />
      <h1>Panel de la carta</h1>
      <p>El Casino<span id="puntos"></span></p>
    </div>
  </div>

  <!-- Acceso (login por email) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <!-- Panel de edición -->
  <script src="https://unpkg.com/decap-cms@^3.8.4/dist/decap-cms.js"></script>

  <script>
    // Puntitos animados mientras carga
    (function () {
      var el = document.getElementById('puntos'), n = 0;
      var t = setInterval(function () {
        if (!el || !el.isConnected) { clearInterval(t); return; }
        n = (n + 1) % 4;
        el.textContent = '.'.repeat(n);
      }, 400);
    })();

    // Quitar la bienvenida cuando el panel esté listo
    function ocultarCarga() {
      var c = document.getElementById('cargando');
      if (!c) return;
      c.classList.add('oculto');
      setTimeout(function () { if (c.parentNode) c.parentNode.removeChild(c); }, 600);
    }
    window.addEventListener('load', function () { setTimeout(ocultarCarga, 800); });
    setTimeout(ocultarCarga, 6000); // por si acaso

    // Si el jefe acepta la invitación por email, entra directo al panel
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', function (user) {
        if (!user) {
          window.netlifyIdentity.on('login', function () { document.location.href = '/admin/'; });
        }
      });
    }
  </script>
</body>
</html>
